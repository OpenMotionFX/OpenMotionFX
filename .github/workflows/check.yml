name: check

# Runs the one verification entry point from a clean checkout (D-0007).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tools/check (full)
        run: node tools/check.mjs
      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore
